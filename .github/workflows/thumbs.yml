# Builds the 160 px WebP thumbnails that tree and board rows load (tools/build-thumbs.py)
# and commits them to assets/thumbs/. Runs when photos or the builder change, or by hand.
name: Thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'assets/photos/**'
      - 'assets/bird-photos/**'
      - 'tools/build-thumbs.py'
      - '.github/workflows/thumbs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.0.0
      - name: Build thumbnails
        run: python tools/build-thumbs.py --all
      - name: Commit changed thumbnails
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898208+github-actions[bot]@users.noreply.github.com'
          git add assets/thumbs
          if git diff --cached --quiet; then echo 'Thumbnails are up to date'; exit 0; fi
          git commit -m 'Build row thumbnails (tools/build-thumbs.py)'
          git push
